<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" fill="none">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Outer Box Frame with gap for ALAWASI -->
    <path d="M 215 175 H 25 V 20 H 575 V 175 H 385" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" fill="none" />
    
    <!-- Latin Lettermark in bottom gap -->
    <text x="300" y="181" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="8">ALAWASI</text>
    
    <!-- Centered Underline below ALAWASI -->
    <line x1="245" y1="198" x2="355" y2="198" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

    <!-- === Geometric Kufic "الأواسي" Inner Calligraphy === -->
    <!-- Right side: Three solid vertical pillars (ا ل أ) -->
    <rect x="522" y="36" width="30" height="120" fill="#FFFFFF" />
    <rect x="476" y="36" width="30" height="120" fill="#FFFFFF" />
    <rect x="430" y="36" width="30" height="120" fill="#FFFFFF" />

    <!-- Horizontal Connecting Baseline from Yaa to Waw -->
    <rect x="44" y="138" width="364" height="18" fill="#FFFFFF" />

    <!-- Waw (و): Vertical Stem and Loop -->
    <rect x="376" y="36" width="28" height="120" fill="#FFFFFF" />
    <path fill-rule="evenodd" d="M 320 36 H 404 V 100 H 320 Z M 346 56 H 378 V 80 H 346 Z" fill="#FFFFFF" />

    <!-- Alif (ا): Stem connected to baseline -->
    <rect x="274" y="36" width="26" height="120" fill="#FFFFFF" />

    <!-- Seen (س): Teeth pillars connected to baseline -->
    <rect x="226" y="36" width="24" height="120" fill="#FFFFFF" />
    <rect x="180" y="36" width="24" height="120" fill="#FFFFFF" />

    <!-- Yaa (ي): Left pillar and square cutouts -->
    <rect x="44" y="36" width="28" height="120" fill="#FFFFFF" />
    <path fill-rule="evenodd" d="M 44 36 H 156 V 100 H 44 Z M 68 56 H 96 V 80 H 68 Z M 108 56 H 136 V 80 H 108 Z" fill="#FFFFFF" />

    <!-- === Centerpiece Calligraphy Identity === -->
    <!-- أكاديمية in vibrant gold -->
    <text x="300" y="248" text-anchor="middle" fill="#FFC425" font-family="'Cairo', 'Tajawal', system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="1">أكاديمية</text>
    <!-- الأواسي in pure crisp white -->
    <text x="300" y="312" text-anchor="middle" fill="#FFFFFF" font-family="'Cairo', 'Tajawal', system-ui, sans-serif" font-size="42" font-weight="900" letter-spacing="2">الأواسي</text>
  </g>
</svg>
