<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%" fill="none">
  <!-- Outer Rectangular Frame with gap at bottom -->
  <path d="M 40 190 L 40 30 L 500 30 L 500 190 L 370 190" stroke="currentColor" stroke-width="6" stroke-linecap="square" fill="none" />
  <path d="M 170 190 L 40 190" stroke="currentColor" stroke-width="6" stroke-linecap="square" fill="none" />

  <!-- Centered ALAWASI in bottom border gap -->
  <text x="270" y="196" text-anchor="middle" fill="currentColor" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="7">ALAWASI</text>

  <!-- Geometric Calligraphy: Three Right Pillars (ا ل ا) -->
  <rect x="446" y="46" width="28" height="128" fill="currentColor" />
  <rect x="402" y="46" width="28" height="128" fill="currentColor" />
  <rect x="358" y="46" width="28" height="128" fill="currentColor" />

  <!-- Continuous Connecting Base Bar -->
  <rect x="58" y="150" width="300" height="24" fill="currentColor" />

  <!-- Waw (و) structure -->
  <rect x="314" y="46" width="26" height="128" fill="currentColor" />
  <path d="M 264 46 L 340 46 L 340 120 L 264 120 Z" fill="currentColor" />
  <!-- Waw inner cutout -->
  <rect x="286" y="68" width="30" height="32" fill="#1673be" class="alawasi-cutout" />

  <!-- Seen (س) teeth -->
  <rect x="222" y="46" width="24" height="128" fill="currentColor" />
  <rect x="180" y="46" width="24" height="128" fill="currentColor" />

  <!-- Left block (ي) and loop -->
  <path d="M 58 46 L 162 46 L 162 120 L 58 120 Z" fill="currentColor" />
  <!-- Two Ya dots as cutouts -->
  <rect x="78" y="66" width="28" height="34" fill="#1673be" class="alawasi-cutout" />
  <rect x="116" y="66" width="28" height="34" fill="#1673be" class="alawasi-cutout" />
  <!-- Leftmost pillar -->
  <rect x="58" y="46" width="24" height="128" fill="currentColor" />

  <!-- Subtitle Divider Line -->
  <line x1="220" y1="220" x2="320" y2="220" stroke="currentColor" stroke-width="3" stroke-linecap="round" />

  <!-- Arabic Official Subtitle (UofK B99) -->
  <text x="270" y="244" text-anchor="middle" fill="currentColor" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="bold" letter-spacing="1">الدفعة التاسعة والتسعون - أواسي</text>
  <text x="270" y="266" text-anchor="middle" fill="currentColor" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="bold" letter-spacing="1">كلية الطب - جامعة الخرطوم</text>
</svg>